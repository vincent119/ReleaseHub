manager_password: ""

runtime:
  shutdown_timeout: 30s

api:
  address: ":7580"
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s

worker:
  reconcile_interval: 30s
  deployment_poll_interval: 1s
  job_lease_duration: 30s
  job_retry_delay: 5s
  application_lock_duration: 30s
  max_parallel_deployments: 10

notifications:
  retention: 168h
  projection_interval: 1s

database:
  server: postgres
  port: 5432
  user: releasehub
  password: ""
  database: releasehub
  ssl_mode: require
  timezone: UTC
  pools:
    api:
      max_open_connections: 20
      max_idle_connections: 5
      connection_lifetime: 30m
    worker:
      max_open_connections: 20
      max_idle_connections: 5
      connection_lifetime: 30m
    migrate:
      max_open_connections: 20
      max_idle_connections: 5
      connection_lifetime: 30m

redis:
  address: redis:6379
  username: ""
  password: ""
  database: 0
  pool_size: 20
  min_idle_connections: 2

log:
  level: info
  format: json
  outputs: [console]
  add_caller: true
  add_stacktrace: false
  development: false
  color_enabled: false

observability:
  metrics_path: /metrics
  tracing:
    enabled: false
    otlp_endpoint: ""
    insecure: false
    sample_ratio: 0.1

oidc:
  issuer: ""
  client_id: ""
  client_secret: ""
  ## The redirect URL is the URL to which the OIDC provider will redirect after successful authentication. It must match the redirect URL configured in the OIDC provider. if empty, not use OIDC authentication.
  redirect_url: "https://releasehub.example.com/api/v1/auth/callback"
  web_redirect_url: "https://releasehub.example.com/"
  logout_url: ""
  post_logout_redirect_url: "https://releasehub.example.com/"
  access_token_max_ttl: 5m

argocd:
  address: ""
  token: ""
  plaintext: false
  insecure: false
  request_timeout: 10s
  application_namespace: argocd

aws:
  account_id: ""
  region: ""
  ecr_repositories: []

session:
  encryption_key: ""
  idle_timeout: 30m
  absolute_ttl: 12h
  login_state_ttl: 5m
  cookie_secure: true

identity:
  sync_interval: 5m

tenancy:
  ## Tenancy mode can be either "single" or "multi". In single tenancy mode, all users belong to the same organization. In multi-tenancy mode, each user belongs to a specific organization and can only access resources within that organization.
  mode: single
  default_organization_id: "00000000-0000-0000-0000-000000000001"
