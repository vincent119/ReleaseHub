apiVersion: apps/v1
kind: Deployment
metadata:
  name: releasehub-api
  labels:
    app.kubernetes.io/name: releasehub
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: releasehub
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: releasehub
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: releasehub
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: releasehub-server:latest
          imagePullPolicy: IfNotPresent
          args:
            - api
            - --config
            - /app/configs/config.yaml
          envFrom:
            - secretRef:
                name: releasehub-secrets
          ports:
            - name: http
              containerPort: 7580
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /app/configs
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: releasehub-config
---
apiVersion: v1
kind: Service
metadata:
  name: releasehub-api
spec:
  selector:
    app.kubernetes.io/name: releasehub
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 7580
      targetPort: http
      protocol: TCP
