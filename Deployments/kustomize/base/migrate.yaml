apiVersion: batch/v1
kind: Job
metadata:
  name: releasehub-migrate
  labels:
    app.kubernetes.io/name: releasehub
    app.kubernetes.io/component: migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-10"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: releasehub
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: releasehub
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: releasehub-server:latest
          imagePullPolicy: IfNotPresent
          args:
            - migrate
            - --config
            - /app/configs/config.yaml
          envFrom:
            - secretRef:
                name: releasehub-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /app/configs
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: releasehub-config
