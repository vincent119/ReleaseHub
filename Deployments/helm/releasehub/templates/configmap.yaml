apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "releasehub.fullname" . }}-config
  labels:
    {{- include "releasehub.labels" . | nindent 4 }}
data:
  config.yaml: |
    runtime:
      shutdown_timeout: 30s
    api:
      address: ":7580"
      read_timeout: 15s
      write_timeout: 30s
      idle_timeout: 60s
    worker:
      reconcile_interval: {{ .Values.configuration.worker.reconcileInterval }}
      deployment_poll_interval: {{ .Values.configuration.worker.deploymentPollInterval }}
      job_lease_duration: {{ .Values.configuration.worker.jobLeaseDuration }}
      job_retry_delay: {{ .Values.configuration.worker.jobRetryDelay }}
      application_lock_duration: {{ .Values.configuration.worker.applicationLockDuration }}
      max_parallel_deployments: {{ .Values.configuration.worker.maxParallelDeployments }}
    notifications:
      retention: {{ .Values.configuration.notifications.retention }}
      projection_interval: {{ .Values.configuration.notifications.projectionInterval }}
    database:
      server: {{ .Values.configuration.database.server | quote }}
      port: {{ .Values.configuration.database.port }}
      user: {{ .Values.configuration.database.user | quote }}
      database: {{ .Values.configuration.database.database | quote }}
      ssl_mode: {{ .Values.configuration.database.sslMode | quote }}
      timezone: UTC
      pools:
        api:
          max_open_connections: 20
          max_idle_connections: 5
          connection_lifetime: 30m
        worker:
          max_open_connections: 20
          max_idle_connections: 5
          connection_lifetime: 30m
        migrate:
          max_open_connections: 5
          max_idle_connections: 2
          connection_lifetime: 30m
    redis:
      address: {{ .Values.configuration.redis.address | quote }}
      username: {{ .Values.configuration.redis.username | quote }}
      database: {{ .Values.configuration.redis.database }}
      pool_size: 20
      min_idle_connections: 2
    log:
      level: info
      format: json
      outputs:
        - console
      add_caller: true
      add_stacktrace: false
      development: false
      color_enabled: false
    observability:
      metrics_path: /metrics
      tracing:
        enabled: {{ .Values.configuration.observability.tracingEnabled }}
        otlp_endpoint: {{ .Values.configuration.observability.otlpEndpoint | quote }}
        insecure: {{ .Values.configuration.observability.tracingInsecure }}
        sample_ratio: {{ .Values.configuration.observability.sampleRatio }}
    oidc:
      issuer: {{ .Values.configuration.oidc.issuer | quote }}
      client_id: {{ .Values.configuration.oidc.clientId | quote }}
      redirect_url: {{ .Values.configuration.oidc.redirectUrl | quote }}
      web_redirect_url: {{ .Values.configuration.oidc.webRedirectUrl | quote }}
      logout_url: {{ .Values.configuration.oidc.logoutUrl | quote }}
      post_logout_redirect_url: {{ .Values.configuration.oidc.postLogoutRedirectUrl | quote }}
      access_token_max_ttl: 5m
    argocd:
      address: {{ .Values.configuration.argocd.address | quote }}
      insecure: {{ .Values.configuration.argocd.insecure }}
      request_timeout: 10s
      application_namespace: {{ .Values.configuration.argocd.applicationNamespace | quote }}
    aws:
      account_id: {{ .Values.configuration.aws.accountId | quote }}
      region: {{ .Values.configuration.aws.region | quote }}
      ecr_repositories:
        {{- toYaml .Values.configuration.aws.ecrRepositories | nindent 8 }}
    session:
      idle_timeout: 30m
      absolute_ttl: 12h
      login_state_ttl: 5m
      cookie_secure: true
    identity:
      sync_interval: 5m
    tenancy:
      mode: {{ .Values.configuration.tenancy.mode | quote }}
      default_organization_id: {{ .Values.configuration.tenancy.defaultOrganizationId | quote }}
