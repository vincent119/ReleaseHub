openapi: 3.0.3
info:
  title: ReleaseHub API
  version: 1.0.0
  description: Shared HTTP API contract for the ReleaseHub frontend and backend.
servers:
  - url: /
tags:
  - name: System
    description: Platform system information.
  - name: Auth
    description: Local and OIDC login with BFF sessions.
  - name: Catalog
    description: Authorized ReleaseHub resource catalog.
  - name: ArgoCD
    description: Argo CD discovery and onboarding management.
  - name: Access
    description: Group, Role, Scope, and Deny management.
  - name: DeploymentRequests
    description: Production Deployment Requests, immutable Versions, and review operations.
  - name: ReleaseWorkflows
    description: Release Workflow definitions, versions, and lifecycle.
  - name: DeploymentPlans
    description: Deployment Plan DAGs, versions, and Environment bindings.
  - name: Deployments
    description: Deployment execution, retry, terminate, unlock, and history.
  - name: Notifications
    description: In-app notifications, read state, and the SSE event stream.
  - name: AuditTrail
    description: Authorized immutable Audit Trail queries.
paths:
  /api/v1/audit/capabilities:
    get:
      operationId: getAuditCapabilities
      summary: Get server-owned Audit Trail visibility and scope roots
      tags: [AuditTrail]
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Audit Trail capability and presentation-safe scope roots.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditCapabilitiesResponse" }
        "401": { description: The user is unauthenticated or the session has expired. }
  /api/v1/audit/filter-options:
    get:
      operationId: listAuditFilterOptions
      summary: Search authorized Audit Trail filter options
      tags: [AuditTrail]
      security: [{ sessionCookie: [] }]
      parameters:
        - name: scopeKind
          in: query
          required: true
          schema: { $ref: "#/components/schemas/AuditScopeKind" }
        - name: scopeId
          in: query
          schema: { type: string, format: uuid }
        - name: occurredFrom
          in: query
          schema: { type: string, format: date-time }
        - name: occurredTo
          in: query
          schema: { type: string, format: date-time }
        - name: field
          in: query
          required: true
          schema: { $ref: "#/components/schemas/AuditFilterOptionField" }
        - name: search
          in: query
          schema: { type: string, maxLength: 255 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Bounded autocomplete values visible in the requested scope and time range.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditFilterOptionListResponse" }
        "400": { description: The option query is invalid. }
        "401": { description: The user is unauthenticated or the session has expired. }
        "404": { description: The Scope does not exist or the caller lacks audit.view. }
  /api/v1/audit/events:
    get:
      operationId: listAuditEvents
      summary: List authorized immutable audit events
      tags: [AuditTrail]
      security: [{ sessionCookie: [] }]
      parameters:
        - name: scopeKind
          in: query
          required: true
          schema: { $ref: "#/components/schemas/AuditScopeKind" }
        - name: scopeId
          in: query
          schema: { type: string, format: uuid }
        - name: occurredFrom
          in: query
          schema: { type: string, format: date-time }
        - name: occurredTo
          in: query
          schema: { type: string, format: date-time }
        - name: action
          in: query
          schema: { type: string, maxLength: 255 }
        - name: resourceType
          in: query
          schema: { type: string, maxLength: 255 }
        - name: actor
          in: query
          schema: { type: string, maxLength: 255 }
        - name: requestId
          in: query
          schema: { type: string, maxLength: 255 }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One stable metadata-free Audit Trail page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventListResponse" }
        "400": { description: The filter or cursor is invalid. }
        "401": { description: The user is unauthenticated or the session has expired. }
        "404": { description: The Scope does not exist or the caller lacks audit.view. }
  /api/v1/audit/events/{auditEventId}:
    get:
      operationId: getAuditEvent
      summary: Get one authorized audit event with safe metadata
      tags: [AuditTrail]
      security: [{ sessionCookie: [] }]
      parameters:
        - name: auditEventId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The authorized event and defensively sanitized metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventDetailResponse" }
        "401": { description: The user is unauthenticated or the session has expired. }
        "404": { description: The event does not exist or is not visible to the caller. }
  /api/v1/access/capabilities:
    get:
      operationId: getAccessCapabilities
      summary: Get server-owned Access collection capabilities
      tags: [Access]
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: Access collection capabilities, content: { application/json: { schema: { $ref: "#/components/schemas/AccessCapabilitiesResponse" } } } }
        "404": { description: The caller has no manageable Access scope. }
  /api/v1/access/users:
    get:
      operationId: listAccessUsers
      summary: List manageable users
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 128 } }
        - { $ref: "#/components/parameters/AccessStatus" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { description: One user page, content: { application/json: { schema: { $ref: "#/components/schemas/AccessUserListResponse" } } } }
        "404": { description: The caller has no manageable Access scope. }
    post:
      operationId: createAccessUser
      summary: Create a local user with a first-login password change requirement
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateAccessUserRequest" } } }
      responses:
        "201": { description: The local user was created, content: { application/json: { schema: { $ref: "#/components/schemas/AccessUserResponse" } } } }
        "404": { description: The caller lacks platform-management permission. }
        "409": { description: The username already exists. }
  /api/v1/access/snapshot:
    get:
      operationId: getAccessManagementSnapshot
      summary: Get access-control data manageable by the current user
      tags: [Access]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Platform administrators receive all data; Project managers receive only data within manageable scopes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessManagementSnapshotResponse"
        "401":
          description: The user is unauthenticated or the session has expired.

        "404":
          description: Access-management data is unavailable or the caller lacks management permission.
  /api/v1/access/groups:
    get:
      operationId: listAccessGroups
      summary: List manageable Groups
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 128 } }
        - { $ref: "#/components/parameters/AccessStatus" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { description: One Group page, content: { application/json: { schema: { $ref: "#/components/schemas/AccessGroupListResponse" } } } }
        "404": { description: The caller has no manageable Access scope. }
    post:
      operationId: createAccessGroup
      summary: Create a Group
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateAccessGroupRequest" } } }
      responses:
        "201": { description: The Group was created, content: { application/json: { schema: { $ref: "#/components/schemas/AccessGroupResponse" } } } }
        "404": { description: The owner does not exist or the caller lacks management permission. }
        "409": { description: The name conflicts or the current data state does not permit creation. }
  /api/v1/access/groups/{groupId}/disable:
    post:
      operationId: disableAccessGroup
      summary: Disable a Group and revoke its active policies
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "204": { description: The Group was disabled. }
        "404": { description: The Group does not exist or the caller lacks management permission. }
        "409": { description: The Group is already disabled or the current data state does not permit the operation. }
  /api/v1/access/groups/{groupId}/memberships:
    post:
      operationId: createAccessMembership
      summary: Add a user to a Group
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateAccessMembershipRequest" } } }
      responses:
        "201": { description: The Membership was created, content: { application/json: { schema: { $ref: "#/components/schemas/AccessMembershipResponse" } } } }
        "404": { description: "The Group or user does not exist, or the caller lacks management permission." }
        "409": { description: The Membership already exists or the current data state does not permit creation. }
  /api/v1/access/groups/{groupId}/membership-candidates:
    get:
      operationId: listAccessMembershipCandidates
      summary: Find minimal user identities eligible for one manageable Group
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: query, in: query, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { description: Eligible minimal user identities, content: { application/json: { schema: { $ref: "#/components/schemas/AccessUserCandidatesResponse" } } } }
        "404": { description: The Group does not exist or the caller lacks management permission. }
  /api/v1/access/scopes/{scopeKind}/{scopeId}/options:
    get:
      operationId: getAccessScopeOptions
      summary: Get legal Group, Role, and Permission options for one selected scope
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: scopeKind, in: path, required: true, schema: { type: string, enum: [platform, project, environment, application] } }
        - { name: scopeId, in: path, required: true, schema: { type: string, minLength: 1 } }
      responses:
        "200": { description: Legal options for the selected scope, content: { application/json: { schema: { $ref: "#/components/schemas/AccessScopeOptionsResponse" } } } }
        "404": { description: The scope does not exist or the caller lacks management permission. }
  /api/v1/access/roles:
    get:
      operationId: listAccessRoles
      summary: List manageable Roles
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 128 } }
        - { $ref: "#/components/parameters/AccessStatus" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { description: One Role page, content: { application/json: { schema: { $ref: "#/components/schemas/AccessRoleListResponse" } } } }
        "404": { description: The caller has no manageable Access scope. }
    post:
      operationId: createAccessRole
      summary: Create a custom Role
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateAccessRoleRequest" } } }
      responses:
        "201": { description: The Role was created, content: { application/json: { schema: { $ref: "#/components/schemas/AccessRoleResponse" } } } }
        "404": { description: "The owner or permission does not exist, or the caller lacks management permission." }
        "409": { description: The name conflicts or the current data state does not permit creation. }
  /api/v1/access/bindings:
    get:
      operationId: listAccessBindings
      summary: List manageable Role bindings
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/AccessStatus" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { description: One Role binding page, content: { application/json: { schema: { $ref: "#/components/schemas/AccessBindingListResponse" } } } }
        "404": { description: The caller has no manageable Access scope. }
    post:
      operationId: createAccessBinding
      summary: Bind a Group and Role to a scope
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateAccessBindingRequest" } } }
      responses:
        "201": { description: The Role binding was created, content: { application/json: { schema: { $ref: "#/components/schemas/AccessBindingResponse" } } } }
        "404": { description: "The Group, Role, or scope does not exist, or the caller lacks management permission." }
        "409": { description: The binding conflicts or the current data state does not permit creation. }
  /api/v1/access/denies:
    get:
      operationId: listAccessDenies
      summary: List manageable explicit Deny policies
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/AccessStatus" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { description: One Deny policy page, content: { application/json: { schema: { $ref: "#/components/schemas/AccessDenyListResponse" } } } }
        "404": { description: The caller has no manageable Access scope. }
    post:
      operationId: createAccessDeny
      summary: Create an explicit Deny policy
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateAccessDenyRequest" } } }
      responses:
        "201": { description: The Deny policy was created, content: { application/json: { schema: { $ref: "#/components/schemas/AccessDenyResponse" } } } }
        "404": { description: "The Group, permission, or scope does not exist, or the caller lacks management permission." }
        "409": { description: The Deny policy conflicts or the current data state does not permit creation. }
  /api/v1/access/users/{userId}/disable:
    post:
      operationId: disableAccessUser
      summary: Disable a local user and revoke all sessions
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "204": { description: The user was disabled and all sessions were revoked. }
        "404": { description: The user does not exist or the caller lacks platform-management permission. }
        "409": { description: The user is already disabled or the current data state does not permit the operation. }
  /api/v1/access/memberships/{membershipId}/revoke:
    post:
      operationId: revokeAccessMembership
      summary: Revoke an active manual Group membership
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: membershipId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "204": { description: The Membership was revoked. }
        "404": { description: The Membership does not exist or the caller lacks management permission. }
        "409": { description: "The Membership is inactive, externally managed, or protected by platform continuity." }
  /api/v1/access/memberships:
    get:
      operationId: listAccessMemberships
      summary: List manageable Group memberships
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: groupId, in: query, schema: { type: string, format: uuid } }
        - { name: userId, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/AccessStatus" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { description: One Membership page, content: { application/json: { schema: { $ref: "#/components/schemas/AccessMembershipListResponse" } } } }
        "404": { description: The caller has no manageable Access scope. }
  /api/v1/access/roles/{roleId}/disable:
    post:
      operationId: disableAccessRole
      summary: Disable an active custom Role
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: roleId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "204": { description: The custom Role was disabled. }
        "404": { description: The Role does not exist or the caller lacks management permission. }
        "409": { description: "The Role is inactive, system-owned, or protected by platform continuity." }
  /api/v1/access/bindings/{bindingId}/revoke:
    post:
      operationId: revokeAccessBinding
      summary: Revoke an active Role binding
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: bindingId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "204": { description: The Role binding was revoked. }
        "404": { description: The Role binding does not exist or the caller lacks management permission. }
        "409": { description: The Role binding is inactive or protected by platform continuity. }
  /api/v1/access/denies/{denyId}/revoke:
    post:
      operationId: revokeAccessDeny
      summary: Revoke an active explicit Deny policy
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: denyId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "204": { description: The Deny policy was revoked. }
        "404": { description: The Deny policy does not exist or the caller lacks management permission. }
        "409": { description: The Deny policy is already inactive. }
  /api/v1/argocd/candidates:
    get:
      operationId: listArgoCDCandidates
      summary: List current Argo CD onboarding candidates
      tags: [ArgoCD]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Only users with the platform-only candidate-view permission are allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArgoCDCandidateListResponse"
        "401":
          description: The user is unauthenticated or the session has expired.
        "404":
          description: The Candidate queue is unavailable or the caller lacks view permission.
  /api/v1/argocd/candidate-assignment-scopes:
    get:
      operationId: listArgoCDCandidateAssignmentScopes
      summary: List production scopes available for Candidate assignment
      tags: [ArgoCD]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Returns only active Organization, Project, and production Environment combinations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArgoCDCandidateAssignmentScopeListResponse"
        "401":
          description: The user is unauthenticated or the session has expired.
        "404":
          description: The Candidate assignment scope is unavailable or the caller lacks view permission.
  /api/v1/argocd/candidates/{candidateId}/assignment:
    post:
      operationId: assignArgoCDCandidate
      summary: Assign a Candidate to a ReleaseHub Application scope
      tags: [ArgoCD]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CandidateId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArgoCDCandidateAssignmentRequest"
      responses:
        "201":
          description: The Catalog Application was created and linked to the Candidate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogApplicationResponse"
        "404":
          description: The Candidate queue is unavailable or the caller lacks operation permission.
        "409":
          description: The Candidate version expired, was already assigned, has a mismatched source, or targets an invalid production Environment.
  /api/v1/catalog/visible-applications:
    get:
      operationId: listVisibleCatalogApplications
      summary: List Applications visible to the current user
      tags: [Catalog]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Returns only active Applications for which the caller has resource.view permission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogApplicationListResponse"
        "401":
          description: The user is unauthenticated or the session has expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/catalog/resource-tree:
    get:
      operationId: getCatalogResourceTree
      summary: Get the resource hierarchy visible to the current user
      tags: [Catalog]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Platform administrators receive all active resources; other users receive authorized scopes and required ancestors only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogResourceTreeResponse"
        "401":
          description: The user is unauthenticated or the session has expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The resource catalog could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Authentication state is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/catalog/organizations:
    post:
      operationId: createCatalogOrganization
      summary: Create an Organization
      tags: [Catalog]
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateNamedResourceRequest" } } }
      responses:
        "201": { description: The Organization was created, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogOrganizationResponse" } } } }
        "404": { description: The caller lacks platform-management permission. }
        "409": { description: The name conflicts or the current data state does not permit creation. }
  /api/v1/catalog/organizations/{organizationId}:
    patch:
      operationId: updateCatalogOrganization
      summary: Rename an Organization
      tags: [Catalog]
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateCatalogOrganizationRequest" } } }
      responses:
        "200": { description: The Organization was renamed, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogOrganizationResponse" } } } }
        "400": { description: The request body or expected version is invalid. }
        "401": { description: The user is unauthenticated or the session has expired. }
        "404": { description: The Organization does not exist or the caller lacks platform-management permission. }
        "409": { description: The name conflicts or the Organization changed concurrently. }
    delete:
      operationId: deleteCatalogOrganization
      summary: Deactivate an empty non-default Organization
      tags: [Catalog]
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: expectedVersion, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "204": { description: The empty non-default Organization was deactivated. }
        "400": { description: The expected version is invalid. }
        "401": { description: The user is unauthenticated or the session has expired. }
        "404": { description: The Organization does not exist or the caller lacks platform-management permission. }
        "409": { description: "The Organization is default, contains Projects, or changed concurrently." }
  /api/v1/catalog/organizations/{organizationId}/projects:
    post:
      operationId: createCatalogProject
      summary: Create a Project
      tags: [Catalog]
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateNamedResourceRequest" } } }
      responses:
        "201": { description: The Project was created, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogProjectResponse" } } } }
        "404": { description: The Organization does not exist or the caller lacks management permission. }
