          description: The Environment binding was created or changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentBindingResponse"
        "401":
          description: The user is unauthenticated or the session has expired.
        "404":
          description: The Scope, Workflow, or Plan Version does not exist, or the caller lacks operation permission.
        "409":
          description: The expectedVersion is stale or the Version is not published.
  /api/v1/deployment-schedules/{environmentId}:
    get:
      operationId: getDeploymentSchedule
      summary: Get the effective deployment schedule for an Environment
      tags:
        - DeploymentPlans
      security:
        - sessionCookie: []
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The effective deployment schedule and current management capability.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentScheduleResponse"
        "401":
          description: The user is unauthenticated or the session has expired.
        "404":
          description: The Environment does not exist or the caller lacks view permission.
    put:
      operationId: updateDeploymentSchedule
      summary: Replace an Environment deployment schedule
      tags:
        - DeploymentPlans
      security:
        - sessionCookie: []
      parameters:
        - name: environmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeploymentScheduleRequest"
      responses:
        "200":
          description: The deployment schedule was replaced or replayed idempotently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentScheduleResponse"
        "400":
          description: The request body or schedule document is invalid.
        "401":
          description: The user is unauthenticated or the session has expired.
        "404":
          description: The Environment does not exist or the caller lacks management permission.
        "409":
          description: The expectedVersion is stale or the Idempotency-Key conflicts.
  /api/v1/deployment-executions/{executionId}:
    get:
      operationId: getDeploymentExecution
      summary: Get a Deployment execution and its Application states
      tags:
        - Deployments
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ExecutionId"
      responses:
        "200":
          description: Detailed Deployment execution state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentExecutionResponse"
        "401":
          description: The user is unauthenticated or the session has expired.
        "404":
          description: The Execution does not exist or the caller lacks view permission.
  /api/v1/deployment-history:
    get:
      operationId: listDeploymentHistory
      summary: List successful deployment history eligible for Forward Rollback evaluation
      tags:
        - Deployments
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentId"
      responses:
        "200":
          description: Fully successful deployment history still visible to the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentHistoryListResponse"
        "401":
          description: The user is unauthenticated or the session has expired.
        "404":
          description: The Scope does not exist or the caller lacks view permission.
  /api/v1/notifications:
    get:
      operationId: listNotifications
      summary: List retained in-app notifications for the current user
      tags:
        - Notifications
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Notification content is filtered or redacted using current permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"
        "401":
          description: The user is unauthenticated or the session has expired.
        "400":
          description: The pagination parameters are invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          description: Notifications could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/notifications/{notificationId}/read:
    post:
      operationId: markNotificationRead
      summary: Mark one notification as read
      tags:
        - Notifications
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/NotificationId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: The notification was marked as read.
        "401":
          description: The user is unauthenticated or the session has expired.
        "404":
          description: The notification does not exist or does not belong to the current user.
        "403":
          description: CSRF, origin, or current-permission validation failed.
        default:
          description: The notification could not be updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      summary: Mark all currently visible notifications as read
      tags:
        - Notifications
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: All currently visible notifications were marked as read.
        "401":
          description: The user is unauthenticated or the session has expired.
        "403":
          description: CSRF or origin validation failed.
        default:
          description: The notification could not be updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/notifications/events:
    get:
      operationId: streamNotificationEvents
      summary: Subscribe to notification events and resume with Last-Event-ID
      tags:
        - Notifications
      security:
        - sessionCookie: []
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Events contain only the event ID and type; the Client must refetch authorized data.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: The user is unauthenticated or the session has expired.
  /api/v1/auth/login:
    get:
      operationId: beginAuthLogin
      summary: Start OIDC login
      security: []
      tags: [Auth]
      responses:
        "302":
          description: Redirects to the OIDC provider.
          headers:
            Location:
              schema:
                type: string
                format: uri
        "4XX":
          description: The login configuration or request is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          description: Login could not be started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/callback:
    get:
      operationId: completeAuthCallback
      summary: Complete the OIDC callback
      security: []
      tags: [Auth]
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: state
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "302":
          description: Creates a BFF Session and redirects to the Web application.
          headers:
            Location:
              schema:
                type: string
        "4XX":
          description: The callback parameters or login state are invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          description: Callback validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/local/login:
    post:
      operationId: loginLocal
      summary: Sign in with a local account
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalLoginRequest"
      responses:
        "200":
          description: Creates a local BFF Session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401":
          description: The credentials are invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/password:
    post:
      operationId: changeLocalPassword
      summary: Change the local account password
      tags: [Auth]
      security:
        - sessionCookie: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: The password was changed and active Sessions were revoked.
        "400":
          description: The current password is invalid or the new password does not meet the local policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/session:
    get:
      operationId: getAuthSession
      summary: Get the current BFF Session
      tags: [Auth]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The Session is valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401":
          description: The user is unauthenticated or the session has expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Authentication state is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/logout:
    post:
      operationId: logoutAuthSession
      summary: Revoke the current BFF Session
      tags: [Auth]
      security:
        - sessionCookie: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: The local Session was revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        "401":
          description: The Session is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/backchannel-logout:
    post:
      operationId: backchannelLogout
      summary: Receive OIDC back-channel logout
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/BackchannelLogoutRequest"
      responses:
        "204":
          description: The corresponding local Sessions were revoked.
        "4XX":
          description: The logout token is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: CSRF validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/system/status:
    get:
      operationId: getSystemStatus
      summary: Get platform system information
      security: []
      tags:
        - System
      responses:
        "200":
          description: The platform can serve requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatusResponse"
        "4XX":
          description: The request format or authorization does not satisfy the contract.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          description: The request could not be processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    OrganizationId:
      name: organizationId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    EnvironmentId:
      name: environmentId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CandidateId:
      name: candidateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    AccessStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [all, active, inactive]
        default: all
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestVersionId:
      name: requestVersionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReviewTaskId:
      name: reviewTaskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkflowId:
      name: workflowId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExpectedWorkflowVersion:
      name: expectedVersion
      in: query
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    WorkflowVersionId:
      name: workflowVersionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlanId:
      name: planId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlanVersionId:
      name: planVersionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExecutionId:
      name: executionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: releasehub_session
  schemas:
    CreateNamedResourceRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
    UpdateCatalogOrganizationRequest:
      type: object
      required: [name, version]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        version: { type: integer, format: int64, minimum: 1 }
    CreateEnvironmentRequest:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        type: { type: string, enum: [Development, Testing, Staging, Production] }
    CreateEnvironmentLabelMappingRequest:
      type: object
      required: [environmentId, labelKey, labelValue]
      properties:
        environmentId: { type: string, format: uuid }
        labelKey: { type: string, minLength: 1, maxLength: 317 }
        labelValue: { type: string, maxLength: 63 }
    CatalogOrganizationResource:
      type: object
      required: [id, name, active, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        active: { type: boolean }
        version: { type: integer, format: int64, minimum: 1 }
    CatalogOrganizationResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/CatalogOrganizationResource" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    CatalogProjectResource:
      type: object
      required: [id, organizationId, name, active, version]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { type: string }
        active: { type: boolean }
        version: { type: integer, format: int64, minimum: 1 }
    CatalogProjectResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/CatalogProjectResource" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    CatalogEnvironmentResource:
      type: object
      required: [id, organizationId, projectId, name, type, active, version]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [Development, Testing, Staging, Production] }
        active: { type: boolean }
        version: { type: integer, format: int64, minimum: 1 }
    CatalogEnvironmentResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/CatalogEnvironmentResource" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    CatalogEnvironmentLabelMappingResource:
      type: object
      required: [id, organizationId, projectId, environmentId, labelKey, labelValue]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        environmentId: { type: string, format: uuid }
        labelKey: { type: string }
        labelValue: { type: string }
    CatalogEnvironmentLabelMappingResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/CatalogEnvironmentLabelMappingResource" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    AccessUser:
      type: object
      required: [id, username, disabled, allowedActions]
      properties:
        id: { type: string, format: uuid }
        username: { type: string, minLength: 1 }
        disabled: { type: boolean }
        allowedActions: { type: array, items: { $ref: "#/components/schemas/AccessAction" } }
    AccessUserCandidate:
      type: object
      required: [id, username]
      properties:
        id: { type: string, format: uuid }
        username: { type: string, minLength: 1 }
    AccessGroup:
      type: object
      required: [id, ownerKind, name, oidcViewerOnly, disabled, allowedActions]
      properties:
        id: { type: string, format: uuid }
        ownerKind: { type: string, enum: [platform, organization, project] }
        ownerId: { type: string, format: uuid, nullable: true }
        name: { type: string, minLength: 1 }
        systemKey: { type: string, nullable: true }
        oidcViewerOnly: { type: boolean }
        disabled: { type: boolean }
        allowedActions: { type: array, items: { $ref: "#/components/schemas/AccessAction" } }
    AccessRole:
      type: object
      required: [id, ownerKind, name, active, permissions, allowedActions]
      properties:
        id: { type: string, format: uuid }
        ownerKind: { type: string, enum: [platform, project] }
        ownerId: { type: string, format: uuid, nullable: true }
        name: { type: string, minLength: 1 }
        systemKey: { type: string, nullable: true }
        active: { type: boolean }
        permissions:
          type: array
          items: { type: string }
        allowedActions: { type: array, items: { $ref: "#/components/schemas/AccessAction" } }
    AccessPermission:
      type: object
      required: [key, platformOnly, projectRoleDelegable]
      properties:
        key: { type: string }
        platformOnly: { type: boolean }
        projectRoleDelegable: { type: boolean }
    AccessMembership:
      type: object
      required: [id, groupId, groupName, userId, username, source, active, allowedActions]
      properties:
        id: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        groupName: { type: string }
        userId: { type: string, format: uuid }
        username: { type: string }
        source: { type: string, enum: [manual, oidc] }
        active: { type: boolean }
        allowedActions: { type: array, items: { $ref: "#/components/schemas/AccessAction" } }
    AccessBinding:
      type: object
      required: [id, groupId, groupName, roleId, roleName, scopeKind, active, allowedActions]
      properties:
        id: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        groupName: { type: string }
        roleId: { type: string, format: uuid }
        roleName: { type: string }
        organizationId: { type: string, format: uuid, nullable: true }
        scopeKind: { type: string, enum: [platform, project, environment, application] }
        projectId: { type: string, format: uuid, nullable: true }
        environmentId: { type: string, format: uuid, nullable: true }
        applicationId: { type: string, format: uuid, nullable: true }
        active: { type: boolean }
        allowedActions: { type: array, items: { $ref: "#/components/schemas/AccessAction" } }
    AccessDeny:
      type: object
      required: [id, groupId, groupName, permission, organizationId, scopeKind, projectId, active, allowedActions]
      properties:
        id: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        groupName: { type: string }
        permission: { type: string }
        organizationId: { type: string, format: uuid }
        scopeKind: { type: string, enum: [project, environment, application] }
        projectId: { type: string, format: uuid }
        environmentId: { type: string, format: uuid, nullable: true }
        applicationId: { type: string, format: uuid, nullable: true }
        active: { type: boolean }
        allowedActions: { type: array, items: { $ref: "#/components/schemas/AccessAction" } }
    AccessAction:
      type: string
      enum: [disable, addMember, viewMemberships, revoke]
    AccessCollectionCapability:
      type: object
      required: [key, visible, canCreate]
      properties:
        key: { type: string, enum: [users, groups, roles, memberships, bindings, denies] }
        visible: { type: boolean }
        canCreate: { type: boolean }
    AccessCapabilities:
      type: object
      required: [collections, permissions]
      properties:
        collections: { type: array, items: { $ref: "#/components/schemas/AccessCollectionCapability" } }
        permissions: { type: array, items: { $ref: "#/components/schemas/AccessPermission" } }
    AccessCapabilitiesResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/AccessCapabilities" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    AccessUserListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/AccessUser" } }
        meta: { $ref: "#/components/schemas/CursorPageMeta" }
    AccessGroupListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/AccessGroup" } }
        meta: { $ref: "#/components/schemas/CursorPageMeta" }
    AccessRoleListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/AccessRole" } }
        meta: { $ref: "#/components/schemas/CursorPageMeta" }
    AccessMembershipListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/AccessMembership" } }
        meta: { $ref: "#/components/schemas/CursorPageMeta" }
    AccessBindingListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/AccessBinding" } }
        meta: { $ref: "#/components/schemas/CursorPageMeta" }
    AccessDenyListResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/AccessDeny" } }
        meta: { $ref: "#/components/schemas/CursorPageMeta" }
    AccessUserCandidatesResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/AccessUserCandidate" } }
        meta: { $ref: "#/components/schemas/CursorPageMeta" }
    AccessScopeOptions:
      type: object
      required: [groups, roles, permissions]
      properties:
        groups: { type: array, items: { $ref: "#/components/schemas/AccessGroup" } }
        roles: { type: array, items: { $ref: "#/components/schemas/AccessRole" } }
        permissions: { type: array, items: { $ref: "#/components/schemas/AccessPermission" } }
    AccessScopeOptionsResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/AccessScopeOptions" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    AccessManagementSnapshot:
      type: object
