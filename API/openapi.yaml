openapi: 3.0.3
info:
  title: ReleaseHub API
  version: 1.0.0
  description: ReleaseHub 前後端共用的 HTTP API 契約。
servers:
  - url: /
tags:
  - name: System
    description: 平台基本資訊。
  - name: Auth
    description: OIDC 登入與 BFF Session。
  - name: Catalog
    description: 受權的 ReleaseHub 資源目錄。
  - name: ArgoCD
    description: Argo CD discovery 與 onboarding 管理。
  - name: Access
    description: Group、Role、Scope 與 Deny 管理。
  - name: DeploymentRequests
    description: Production Deployment Request、immutable Version 與審核操作。
  - name: ReleaseWorkflows
    description: Release Workflow 定義、版本與生命週期。
  - name: DeploymentPlans
    description: Deployment Plan DAG、版本與 Environment binding。
  - name: Deployments
    description: Deployment execution、retry、terminate、unlock 與歷史。
  - name: Notifications
    description: 站內通知、已讀狀態與 SSE event stream。
paths:
  /api/v1/access/snapshot:
    get:
      operationId: getAccessManagementSnapshot
      summary: 取得目前使用者可管理的存取控制資料
      tags: [Access]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 平台管理者取得全部資料；Project 管理者只取得可管理 scope 的資料。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessManagementSnapshotResponse"
        "401":
          description: 未登入或 Session 已失效。

        "404":
          description: Access management 不存在或呼叫者無管理權限。
  /api/v1/access/groups:
    post:
      operationId: createAccessGroup
      summary: 建立 Group
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateAccessGroupRequest" } } }
      responses:
        "201": { description: Group 已建立, content: { application/json: { schema: { $ref: "#/components/schemas/AccessGroupResponse" } } } }
        "404": { description: Owner 不存在或呼叫者無管理權限。 }
        "409": { description: 名稱衝突或資料狀態不允許建立。 }
  /api/v1/access/groups/{groupId}/disable:
    post:
      operationId: disableAccessGroup
      summary: 停用 Group 並撤銷其有效 policy
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "204": { description: Group 已停用。 }
        "404": { description: Group 不存在或呼叫者無管理權限。 }
        "409": { description: Group 已停用或資料狀態不允許操作。 }
  /api/v1/access/groups/{groupId}/memberships:
    post:
      operationId: createAccessMembership
      summary: 將使用者加入 Group
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateAccessMembershipRequest" } } }
      responses:
        "201": { description: Membership 已建立, content: { application/json: { schema: { $ref: "#/components/schemas/AccessMembershipResponse" } } } }
        "404": { description: Group 或使用者不存在，或呼叫者無管理權限。 }
        "409": { description: Membership 已存在或資料狀態不允許建立。 }
  /api/v1/access/roles:
    post:
      operationId: createAccessRole
      summary: 建立自訂 Role
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateAccessRoleRequest" } } }
      responses:
        "201": { description: Role 已建立, content: { application/json: { schema: { $ref: "#/components/schemas/AccessRoleResponse" } } } }
        "404": { description: Owner 或 permission 不存在，或呼叫者無管理權限。 }
        "409": { description: 名稱衝突或資料狀態不允許建立。 }
  /api/v1/access/bindings:
    post:
      operationId: createAccessBinding
      summary: 建立 Group、Role 與 scope 綁定
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateAccessBindingRequest" } } }
      responses:
        "201": { description: Role binding 已建立, content: { application/json: { schema: { $ref: "#/components/schemas/AccessBindingResponse" } } } }
        "404": { description: Group、Role 或 scope 不存在，或呼叫者無管理權限。 }
        "409": { description: Binding 衝突或資料狀態不允許建立。 }
  /api/v1/access/denies:
    post:
      operationId: createAccessDeny
      summary: 建立明確拒絕 policy
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateAccessDenyRequest" } } }
      responses:
        "201": { description: Deny policy 已建立, content: { application/json: { schema: { $ref: "#/components/schemas/AccessDenyResponse" } } } }
        "404": { description: Group、permission 或 scope 不存在，或呼叫者無管理權限。 }
        "409": { description: Deny policy 衝突或資料狀態不允許建立。 }
  /api/v1/access/users/{userId}/disable:
    post:
      operationId: disableAccessUser
      summary: 本地停用使用者並撤銷所有 Session
      tags: [Access]
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "204": { description: 使用者已停用且 Session 已撤銷。 }
        "404": { description: 使用者不存在或呼叫者無平台管理權限。 }
        "409": { description: 使用者已停用或資料狀態不允許操作。 }
  /api/v1/argocd/candidates:
    get:
      operationId: listArgoCDCandidates
      summary: 列出目前存在的 Argo CD onboarding candidates
      tags: [ArgoCD]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 僅限具 platform-only candidate view 權限的使用者。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArgoCDCandidateListResponse"
        "401":
          description: 未登入或 Session 已失效。
        "404":
          description: Candidate queue 不存在或呼叫者無權查看。
  /api/v1/argocd/candidate-assignment-scopes:
    get:
      operationId: listArgoCDCandidateAssignmentScopes
      summary: 列出 Candidate 可指派的 production scope
      tags: [ArgoCD]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 僅回傳 active Organization、Project 與 production Environment 組合。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArgoCDCandidateAssignmentScopeListResponse"
        "401":
          description: 未登入或 Session 已失效。
        "404":
          description: Candidate assignment scope 不存在或呼叫者無權查看。
  /api/v1/argocd/candidates/{candidateId}/assignment:
    post:
      operationId: assignArgoCDCandidate
      summary: 將 Candidate 指派至 ReleaseHub Application scope
      tags: [ArgoCD]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CandidateId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArgoCDCandidateAssignmentRequest"
      responses:
        "201":
          description: 已建立並連結 Candidate 的 Catalog Application。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogApplicationResponse"
        "404":
          description: Candidate queue 不存在或呼叫者無權操作。
        "409":
          description: Candidate version 過期、已指派、source 不相符或目標不是有效 production Environment。
  /api/v1/catalog/visible-applications:
    get:
      operationId: listVisibleCatalogApplications
      summary: 列出目前使用者可查看的 Applications
      tags: [Catalog]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 僅回傳呼叫者具 resource.view 權限的 active Applications。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogApplicationListResponse"
        "401":
          description: 未登入或 Session 已失效。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/catalog/resource-tree:
    get:
      operationId: getCatalogResourceTree
      summary: 取得目前使用者可見的資源階層
      tags: [Catalog]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 平台管理者取得全部 active 資源；其他使用者僅取得授權範圍與必要祖先。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogResourceTreeResponse"
        "401":
          description: 未登入或 Session 已失效。
  /api/v1/catalog/organizations:
    post:
      operationId: createCatalogOrganization
      summary: 建立 Organization
      tags: [Catalog]
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateNamedResourceRequest" } } }
      responses:
        "201": { description: Organization 已建立, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogOrganizationResponse" } } } }
        "404": { description: 呼叫者沒有平台管理權限。 }
        "409": { description: 名稱衝突或資料狀態不允許建立。 }
  /api/v1/catalog/organizations/{organizationId}/projects:
    post:
      operationId: createCatalogProject
      summary: 建立 Project
      tags: [Catalog]
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateNamedResourceRequest" } } }
      responses:
        "201": { description: Project 已建立, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogProjectResponse" } } } }
        "404": { description: Organization 不存在或呼叫者沒有管理權限。 }
        "409": { description: 名稱衝突或資料狀態不允許建立。 }
  /api/v1/catalog/organizations/{organizationId}/projects/{projectId}/environments:
    post:
      operationId: createCatalogEnvironment
      summary: 建立 Environment
      tags: [Catalog]
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateEnvironmentRequest" } } }
      responses:
        "201": { description: Environment 已建立, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogEnvironmentResponse" } } } }
        "404": { description: Project 不存在或呼叫者沒有管理權限。 }
        "409": { description: 名稱衝突或資料狀態不允許建立。 }
  /api/v1/catalog/organizations/{organizationId}/projects/{projectId}/environment-label-mappings:
    post:
      operationId: createCatalogEnvironmentLabelMapping
      summary: 建立 Argo CD label 至 Environment mapping
      tags: [Catalog]
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateEnvironmentLabelMappingRequest" } } }
      responses:
        "201": { description: Environment label mapping 已建立, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogEnvironmentLabelMappingResponse" } } } }
        "404": { description: Project 不存在或呼叫者沒有管理權限。 }
        "409": { description: Mapping 衝突或資料狀態不允許建立。 }
  /api/v1/catalog/applications:
    get:
      operationId: listCatalogApplications
      summary: 列出 Environment 中受權的 Applications
      tags: [Catalog]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentId"
      responses:
        "200":
          description: 僅回傳呼叫者於指定 Environment 有查看權限的 Applications；無權限時為空清單。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogApplicationListResponse"
        "401":
          description: 未登入或 Session 已失效。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: 資源識別格式無效。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/catalog/applications/{applicationId}:
    get:
      operationId: getCatalogApplication
      summary: 取得受權的單一 Application
      tags: [Catalog]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: Application mapping。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogApplicationResponse"
        "401":
          description: 未登入或 Session 已失效。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Application 不存在或呼叫者無權查看。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/catalog/applications/{applicationId}/status:
    get:
      operationId: getCatalogApplicationStatus
      summary: 取得受權 Application 的 Argo CD 與 onboarding 狀態
      tags: [Catalog]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: 最近一次 reconciliation 與 onboarding 狀態。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogApplicationStatusResponse"
        "401":
          description: 未登入或 Session 已失效。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Application 不存在或呼叫者無權查看。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/catalog/applications/{applicationId}/onboarding/dry-run:
    post:
      operationId: dryRunApplicationOnboarding
      summary: 驗證 Application onboarding 條件
      tags: [Catalog]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: 已保存的 dry-run 結果。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingResponse"
        "404":
          description: Application 不存在或呼叫者無權操作。
  /api/v1/catalog/applications/{applicationId}/onboarding/confirm:
    post:
      operationId: confirmApplicationOnboarding
      summary: 確認 onboarding 並關閉 automated sync
      tags: [Catalog]
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingConfirmRequest"
      responses:
        "200":
          description: 已完成或可安全重播的 onboarding 結果。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingResponse"
        "202":
          description: 原確認命令仍在執行或等待 Worker 復原。
        "409":
          description: onboarding version 已過期或 Idempotency-Key 被不同請求重用。
  /api/v1/deployment-requests:
    get:
      operationId: listDeploymentRequests
      summary: 列出目前使用者可查看的 Deployment Request
      tags:
        - DeploymentRequests
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentId"
      responses:
        "200":
          description: 依建立時間反向排序的 Deployment Request。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentRequestListResponse"
        "401":
          description: 未登入或 Session 已失效。
        "404":
          description: Scope 不存在或呼叫者無權查看。
  /api/v1/deployment-requests/{requestId}:
    get:
      operationId: getDeploymentRequest
      summary: 取得 Deployment Request、Version 與目前流程快照
      tags:
        - DeploymentRequests
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Deployment Request 詳細資料。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentRequestDetailResponse"
        "401":
          description: 未登入或 Session 已失效。
        "404":
          description: Request 不存在或呼叫者無權查看。
  /api/v1/deployment-requests/{requestId}/versions/{requestVersionId}:
    patch:
      operationId: updateDeploymentRequestVersionMetadata
      summary: 以新 Version 更新受審的選填資料
      tags:
        - DeploymentRequests
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/RequestVersionId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeploymentRequestVersionRequest"
      responses:
        "200":
          description: 已建立新的 immutable Version。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentRequestVersionResponse"
        "401":
          description: 未登入或 Session 已失效。
        "404":
          description: Request Version 不存在或呼叫者無權操作。
        "409":
          description: expectedVersion 過期或 Version 狀態不允許修改。
  /api/v1/deployment-requests/{requestId}/versions/{requestVersionId}/reviews/{reviewTaskId}/decisions:
    post:
      operationId: decideDeploymentReview
      summary: 核准或拒絕 Deployment Request review task
      tags:
        - DeploymentRequests
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/RequestVersionId"
        - $ref: "#/components/parameters/ReviewTaskId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeploymentReviewDecisionRequest"
      responses:
        "200":
          description: Review decision 已保存並重新計算 workflow state。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentRequestVersionResponse"
        "401":
          description: 未登入或 Session 已失效。
        "404":
          description: Review task 不存在或呼叫者無權操作。
        "409":
          description: Idempotency-Key 衝突、Version 已失效或 task 已關閉。
        "422":
          description: Review decision 不符合 Workflow policy。
  /api/v1/deployment-requests/{requestId}/versions/{requestVersionId}/reviews/{reviewTaskId}/reassignments:
    post:
      operationId: reassignDeploymentReview
      summary: 重新指派等待中的 Deployment Request review task
      tags:
        - DeploymentRequests
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/RequestVersionId"
        - $ref: "#/components/parameters/ReviewTaskId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeploymentReviewReassignmentRequest"
      responses:
        "200":
          description: Review task 已重新指派並保存稽核紀錄。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentRequestVersionResponse"
        "401":
          description: 未登入或 Session 已失效。
        "404":
          description: Review task 不存在或呼叫者無權操作。
        "409":
          description: Idempotency-Key 衝突、Version 已失效或 task 已關閉。
        "422":
          description: 新指派或原因不符合 Workflow policy。
  /api/v1/deployment-requests/{requestId}/versions/{requestVersionId}/transitions:
    post:
      operationId: transitionDeploymentRequest
      summary: 執行 Workflow 允許的 transition
      tags:
        - DeploymentRequests
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/RequestVersionId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeploymentTransitionRequest"
      responses:
        "202":
          description: Transition 已接受；若產生 deployment intent，將由 Worker 非同步執行。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentRequestVersionResponse"
        "401":
          description: 未登入或 Session 已失效。
        "404":
          description: Request Version 不存在或呼叫者無權操作。
        "409":
          description: Idempotency-Key、optimistic version 或目前狀態衝突。
        "422":
          description: Workflow 不允許此 transition。
  /api/v1/deployment-requests/{requestId}/versions/{requestVersionId}/retry:
    post:
      operationId: retryDeploymentRequest
      summary: 依 Workflow 與 Plan 重試指定失敗 Application
      tags:
        - Deployments
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/RequestVersionId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeploymentRetryRequest"
      responses:
        "202":
          description: Retry execution 已排入 queue。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentExecutionResponse"
        "401":
          description: 未登入或 Session 已失效。
        "404":
          description: Request Version 不存在或呼叫者無權操作。
        "409":
          description: Idempotency-Key、操作鎖或 execution 狀態衝突。
        "422":
          description: Workflow／Plan 不允許 retry，或選到非失敗 Application。
  /api/v1/deployment-requests/{requestId}/versions/{requestVersionId}/terminate:
    post:
      operationId: terminateDeploymentRequest
      summary: 依 Workflow 終止未收斂的 deployment execution
      tags:
        - Deployments
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/RequestVersionId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeploymentTerminateRequest"
      responses:
        "202":
          description: Terminate intent 已接受。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentExecutionResponse"
        "401":
          description: 未登入或 Session 已失效。
        "404":
          description: Execution 不存在或呼叫者無權操作。
        "409":
          description: Idempotency-Key 或 execution 狀態衝突。
        "422":
          description: Workflow 不允許 terminate。
  /api/v1/deployment-requests/{requestId}/versions/{requestVersionId}/unlock:
    post:
      operationId: unlockDeploymentRequest
      summary: 核對實際狀態後人工解除 Application operation lock
      tags:
        - Deployments
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/RequestVersionId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeploymentUnlockRequest"
      responses:
        "202":
          description: Unlock reconciliation 已接受。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentExecutionResponse"
        "401":
          description: 未登入或 Session 已失效。
        "404":
          description: Execution 不存在或呼叫者無權操作。
        "409":
          description: Idempotency-Key 或 actual state 不一致。
        "422":
          description: 未填理由、未確認全部 Application 或狀態不允許解鎖。
  /api/v1/release-workflows:
    get:
      operationId: listReleaseWorkflows
      summary: 列出 Release Workflow 與版本
      tags:
        - ReleaseWorkflows
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 可查看的 Workflow 定義。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseWorkflowListResponse"
        "401":
          description: 未登入或 Session 已失效。
    post:
      operationId: createReleaseWorkflow
      summary: 建立 Release Workflow 與第一個 Draft Version
      tags:
        - ReleaseWorkflows
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReleaseWorkflowRequest"
      responses:
        "201":
          description: Workflow 與 Draft Version 已建立。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseWorkflowResponse"
        "401":
          description: 未登入或 Session 已失效。
        "409":
          description: Workflow 名稱衝突。
  /api/v1/release-workflows/{workflowId}/versions:
    post:
      operationId: createReleaseWorkflowVersion
      summary: 建立下一個 Release Workflow Draft Version
      tags:
        - ReleaseWorkflows
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReleaseWorkflowVersionRequest"
      responses:
        "201":
          description: Draft Version 已建立。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseWorkflowVersionResponse"
        "401":
          description: 未登入或 Session 已失效。
        "404":
          description: Workflow 不存在或呼叫者無權操作。
        "409":
          description: expectedVersion 過期或已有衝突 Draft。
  /api/v1/release-workflows/{workflowId}/versions/{workflowVersionId}/lifecycle:
    post:
      operationId: changeReleaseWorkflowVersionLifecycle
      summary: 發布或停用 Release Workflow Version
      tags:
        - ReleaseWorkflows
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
        - $ref: "#/components/parameters/WorkflowVersionId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DefinitionLifecycleRequest"
      responses:
        "200":
          description: Workflow Version lifecycle 已變更。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseWorkflowVersionResponse"
        "401":
          description: 未登入或 Session 已失效。
        "404":
          description: Workflow Version 不存在或呼叫者無權操作。
        "409":
          description: expectedVersion 過期或 lifecycle transition 不合法。
        "422":
          description: Workflow document 無法解析或執行。
  /api/v1/deployment-plans:
    get:
      operationId: listDeploymentPlans
      summary: 列出可查看的 Deployment Plan 與版本
      tags:
        - DeploymentPlans
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: 可查看的 Deployment Plan。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentPlanListResponse"
        "401":
          description: 未登入或 Session 已失效。
        "404":
          description: Project 不存在或呼叫者無權查看。
    post:
      operationId: createDeploymentPlan
      summary: 建立 Deployment Plan 與第一個 Draft Version
      tags:
        - DeploymentPlans
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeploymentPlanRequest"
      responses:
        "201":
          description: Plan 與 Draft Version 已建立。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentPlanResponse"
        "401":
          description: 未登入或 Session 已失效。
        "409":
          description: Plan 名稱衝突。
  /api/v1/deployment-plans/{planId}/versions:
    post:
      operationId: createDeploymentPlanVersion
      summary: 建立下一個 Deployment Plan Draft Version
      tags:
        - DeploymentPlans
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PlanId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeploymentPlanVersionRequest"
      responses:
        "201":
          description: Draft Version 已建立。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentPlanVersionResponse"
        "401":
          description: 未登入或 Session 已失效。
        "404":
          description: Plan 不存在或呼叫者無權操作。
        "409":
          description: expectedVersion 過期或已有衝突 Draft。
  /api/v1/deployment-plans/{planId}/versions/{planVersionId}/lifecycle:
    post:
      operationId: changeDeploymentPlanVersionLifecycle
      summary: 發布或停用 Deployment Plan Version
      tags:
        - DeploymentPlans
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PlanId"
        - $ref: "#/components/parameters/PlanVersionId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DefinitionLifecycleRequest"
      responses:
        "200":
          description: Plan Version lifecycle 已變更。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentPlanVersionResponse"
        "401":
          description: 未登入或 Session 已失效。
        "404":
          description: Plan Version 不存在或呼叫者無權操作。
        "409":
          description: expectedVersion 過期或 lifecycle transition 不合法。
        "422":
          description: Plan document 包含 cycle 或無法執行。
  /api/v1/deployment-bindings:
    get:
      operationId: getDeploymentBinding
      summary: 取得 Environment 現行的 Workflow 與 Plan Version binding
      tags:
        - DeploymentPlans
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentId"
      responses:
        "200":
          description: Environment 現行 binding；尚未綁定時 data 為 null。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentBindingResponse"
        "401":
          description: 未登入或 Session 已失效。
        "404":
          description: Scope 不存在或呼叫者無權查看。
    post:
      operationId: bindDeploymentDefinitions
      summary: 綁定 Environment 使用的 Workflow 與 Plan Version
      tags:
        - DeploymentPlans
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindDeploymentDefinitionsRequest"
      responses:
        "200":
          description: Environment binding 已建立或切換。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentBindingResponse"
        "401":
          description: 未登入或 Session 已失效。
        "404":
          description: Scope、Workflow 或 Plan Version 不存在，或呼叫者無權操作。
        "409":
          description: expectedVersion 過期或 Version 未發布。
  /api/v1/deployment-executions/{executionId}:
    get:
      operationId: getDeploymentExecution
      summary: 取得 Deployment execution 與各 Application 狀態
      tags:
        - Deployments
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ExecutionId"
      responses:
        "200":
          description: Deployment execution 詳細狀態。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentExecutionResponse"
        "401":
          description: 未登入或 Session 已失效。
        "404":
          description: Execution 不存在或呼叫者無權查看。
  /api/v1/deployment-history:
    get:
      operationId: listDeploymentHistory
      summary: 列出可供 Forward Rollback 判斷的成功部署歷史
      tags:
        - Deployments
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/EnvironmentId"
      responses:
        "200":
          description: 完整成功且仍可查看的部署歷史。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentHistoryListResponse"
        "401":
          description: 未登入或 Session 已失效。
        "404":
          description: Scope 不存在或呼叫者無權查看。
  /api/v1/notifications:
    get:
      operationId: listNotifications
      summary: 列出目前使用者保存期限內的站內通知
      tags:
        - Notifications
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 通知內容已依當下權限過濾或遮蔽。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"
        "401":
          description: 未登入或 Session 已失效。
        "400":
          description: 分頁參數無效。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          description: 無法讀取通知。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/notifications/{notificationId}/read:
    post:
      operationId: markNotificationRead
      summary: 將一筆通知標記為已讀
      tags:
        - Notifications
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/NotificationId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: 通知已標記為已讀。
        "401":
          description: 未登入或 Session 已失效。
        "404":
          description: 通知不存在或不屬於目前使用者。
        "403":
          description: CSRF、來源或目前權限驗證失敗。
        default:
          description: 無法更新通知。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      summary: 將目前可見通知全部標記為已讀
      tags:
        - Notifications
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: 目前可見通知已全部標記為已讀。
        "401":
          description: 未登入或 Session 已失效。
        "403":
          description: CSRF 或來源驗證失敗。
        default:
          description: 無法更新通知。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/notifications/events:
    get:
      operationId: streamNotificationEvents
      summary: 訂閱通知事件並以 Last-Event-ID 恢復
      tags:
        - Notifications
      security:
        - sessionCookie: []
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Event 僅包含 event ID 與 type，Client 必須重新讀取受權資料。
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: 未登入或 Session 已失效。
  /api/v1/auth/login:
    get:
      operationId: beginAuthLogin
      summary: 開始 OIDC 登入
      security: []
      tags: [Auth]
      responses:
        "302":
          description: 導向 OIDC provider。
          headers:
            Location:
              schema:
                type: string
                format: uri
        "4XX":
          description: 登入設定或請求無效。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          description: 無法開始登入。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/callback:
    get:
      operationId: completeAuthCallback
      summary: 完成 OIDC callback
      security: []
      tags: [Auth]
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: state
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "302":
          description: 建立 BFF Session 後導回 Web。
          headers:
            Location:
              schema:
                type: string
        "4XX":
          description: Callback 參數或登入狀態無效。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          description: Callback 驗證失敗。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/session:
    get:
      operationId: getAuthSession
      summary: 取得目前 BFF Session
      tags: [Auth]
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Session 有效。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401":
          description: 未登入或 Session 已失效。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/logout:
    post:
      operationId: logoutAuthSession
      summary: 撤銷目前 BFF Session
      tags: [Auth]
      security:
        - sessionCookie: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: 本地 Session 已撤銷。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        "401":
          description: Session 無效。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/backchannel-logout:
    post:
      operationId: backchannelLogout
      summary: 接收 OIDC back-channel logout
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/BackchannelLogoutRequest"
      responses:
        "204":
          description: 對應的本地 Session 已撤銷。
        "4XX":
          description: Logout token 無效。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: CSRF 驗證失敗。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/system/status:
    get:
      operationId: getSystemStatus
      summary: 取得平台基本資訊
      security: []
      tags:
        - System
      responses:
        "200":
          description: 平台可回應請求。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatusResponse"
        "4XX":
          description: 請求格式或授權不符合契約。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          description: 無法處理請求。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    OrganizationId:
      name: organizationId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    EnvironmentId:
      name: environmentId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CandidateId:
      name: candidateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestVersionId:
      name: requestVersionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReviewTaskId:
      name: reviewTaskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkflowId:
      name: workflowId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkflowVersionId:
      name: workflowVersionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlanId:
      name: planId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlanVersionId:
      name: planVersionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExecutionId:
      name: executionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: releasehub_session
  schemas:
    CreateNamedResourceRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
    CreateEnvironmentRequest:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        type: { type: string, enum: [Development, Testing, Staging, Production] }
    CreateEnvironmentLabelMappingRequest:
      type: object
      required: [environmentId, labelKey, labelValue]
      properties:
        environmentId: { type: string, format: uuid }
        labelKey: { type: string, minLength: 1, maxLength: 317 }
        labelValue: { type: string, maxLength: 63 }
    CatalogOrganizationResource:
      type: object
      required: [id, name, active, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        active: { type: boolean }
        version: { type: integer, format: int64, minimum: 1 }
    CatalogOrganizationResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: "#/components/schemas/CatalogOrganizationResource" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
    CatalogProjectResource:
      type: object
      required: [id, organizationId, name, active, version]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
